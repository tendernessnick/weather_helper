[project]
name = "weather-helper-backend"
version = "0.1.0"
description = "Weather helper for Hong Kong tennis players: per-court hourly forecast with community-verified accuracy scoring"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "httpx>=0.27",
    "pywebpush>=2.0",
    "opencc-python-reimplemented>=0.1.7",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
